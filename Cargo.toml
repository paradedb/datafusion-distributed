[workspace]
members = [
    "datafusion/datasets",
    "datafusion/distributed",
    "datafusion/distributed-benchmarks",
    "datafusion/distributed-cli",
    "datafusion/distributed-console",
    "datafusion/distributed-iceberg",
    "datafusion/distributed-iceberg-benchmarks",
    "datafusion/distributed-iceberg-test-tools",
    "datafusion/distributed-remote-worker",
]
# Plain `cargo build`/`cargo test` from the repository root target the core library.
default-members = ["datafusion/distributed"]
resolver = "3"

[workspace.dependencies]
datafusion = { git = "https://github.com/paradedb/datafusion.git", branch = "paradedb.branch-55", default-features = false }
datafusion-proto = { git = "https://github.com/paradedb/datafusion.git", branch = "paradedb.branch-55", default-features = false }
datafusion-cli = { git = "https://github.com/paradedb/datafusion.git", branch = "paradedb.branch-55", default-features = false }

[workspace.lints.clippy]
disallowed_types = "deny"
disallowed-methods = "deny"

# `datafusion-iceberg` depends on crates.io `datafusion`. Without this patch it pulls a second
# copy of DataFusion next to the paradedb fork pinned in `[workspace.dependencies]`, and the
# iceberg crate fails to compile with mismatched `Expr` types from the two copies.
[patch.crates-io]
datafusion = { git = "https://github.com/paradedb/datafusion.git", branch = "paradedb.branch-55" }
